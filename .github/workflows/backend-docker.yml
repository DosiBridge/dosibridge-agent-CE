name: Build and Push Backend Docker Image

on:
  push:
    branches:
      - develop
      - main
      - master
    paths:
      - 'backend/**'
      - 'docker-compose.production.yml'
      - '.github/workflows/backend-docker.yml'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify backend files
        run: |
          test -f backend/requirements.txt
          test -f backend/Dockerfile

      - name: Build Docker image
        run: |
          docker build \
            --build-arg PYTHON_VERSION="3.11.6" \
            --build-arg UID="1000" \
            -f backend/Dockerfile \
            -t mcp-server:latest \
            backend/

      - name: Verify backend image imports
        run: |
          docker run --rm \
            --entrypoint python \
            -e DATABASE_URL='postgresql://ci_user:ci_password@localhost:5432/ci_db' \
            -e JWT_SECRET_KEY='ci-only-dummy-jwt-secret-at-least-32-chars' \
            -e ENCRYPTION_KEY='ci-only-dummy-encryption-key-at-least-32-chars' \
            mcp-server:latest \
            -c "import packaging; from langchain_core.tools import BaseTool, StructuredTool; import src.api; print('backend image imports ok')"

      - name: Push Docker image
        run: |
          docker tag mcp-server:latest ${{ secrets.DOCKER_USERNAME }}/mcp-server:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/mcp-server:latest

  deploy:
    name: Deploy agent backend to DappleSoft VPS
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload production compose file
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          COMPOSE_DIR: /home/dapplesoft/apps/docker-compose/dosibridge-agent
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" "mkdir -p '$COMPOSE_DIR'"
          scp -i ~/.ssh/id_ed25519 -P "$PROD_PORT" docker-compose.production.yml "$PROD_USER@$PROD_HOST:$COMPOSE_DIR/docker-compose.yml"

      - name: Deploy with isolated Docker Compose project
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          COMPOSE_DIR: /home/dapplesoft/apps/docker-compose/dosibridge-agent
          COMPOSE_PROJECT: dosibridge-agent
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            "COMPOSE_DIR='$COMPOSE_DIR' COMPOSE_PROJECT='$COMPOSE_PROJECT' bash -s" <<'REMOTE_DEPLOY'
          set -euo pipefail
          LOCK_FILE="/tmp/dosibridge-agent-deploy.lock"
          flock "$LOCK_FILE" bash -s <<'LOCKED_DEPLOY'
          set -euo pipefail
          cd "$COMPOSE_DIR"
          test -f .env
          echo "Checking sibling DosiBridge root before deploy"
          curl -fsSI --max-time 15 http://127.0.0.1:8081/ >/dev/null
          docker compose -p "$COMPOSE_PROJECT" -f docker-compose.yml config >/tmp/dosibridge-agent-compose-config.txt
          docker compose -p "$COMPOSE_PROJECT" -f docker-compose.yml pull agent-backend agent-frontend db
          docker compose -p "$COMPOSE_PROJECT" -f docker-compose.yml up -d --no-deps agent-backend agent-frontend
          docker compose -p "$COMPOSE_PROJECT" -f docker-compose.yml ps agent-backend agent-frontend db
          for i in $(seq 1 45); do
            curl -fsS --max-time 5 http://127.0.0.1:8085/health >/dev/null && break
            sleep 2
            [ "$i" -eq 45 ] && exit 1
          done
          for i in $(seq 1 45); do
            curl -fsSI --max-time 5 http://127.0.0.1:8086/ >/dev/null && break
            sleep 2
            [ "$i" -eq 45 ] && exit 1
          done
          curl -fsSI --max-time 15 http://127.0.0.1:8081/ >/dev/null
          echo "Agent backend deploy verified"
          LOCKED_DEPLOY
          REMOTE_DEPLOY

      - name: Verify public endpoints best-effort
        run: |
          curl -sS -k --max-time 30 https://agentapi.dosibridge.com/health || true
          curl -sSI -k --max-time 30 https://agent.dosibridge.com/ || true
